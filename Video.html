
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Video</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  color: white;
  font-family: Arial, sans-serif;
  background: black;
}

.video-bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}

.content {
  height: 500vh;
  text-align: center;
}

section {
  height: 100vh;
  display: grid;
  place-content: center;
  padding: 20px;
  text-shadow: 0 2px 8px black;
}

h1 {
  font-size: clamp(36px, 7vw, 80px);
}

p {
  font-size: 20px;
  margin-top: 15px;
}
</style>
</head>
<body>

<video class="video-bg" muted playsinline preload="auto">
  <source src="background.mp4" type="video/mp4">
</video>

<div class="content">
  <section>
    <div>
      <h1>HE WHO REMAIN</h1>
      <p>NEVER TRUST ANYONE</p>
    </div>
  </section>

  <section>
    <div>
      <h1>SEE YOU </h1>
      <p>NOW RUN FOR YOU LIFE</p>
    </div>
  </section>

  <section>
    <div>
      <h1>IT ALWAY FIND YOU</h1>
      <p>YOU HIDE BUT CAN RUN</p>
    </div>
  </section>

  <section>
    <div>
      <h1>Keep Exploring</h1>
    </div>
  </section>

  <section>
    <div>
      <h1>The End</h1>
    </div>
  </section>
</div>



<script>
const video = document.querySelector(".video-bg");

let ready = false;
let targetTime = 0;
let currentTime = 0;
let animationStarted = false;

video.pause();

video.addEventListener("loadedmetadata", () => {
  ready = true;
  updateTarget();
  currentTime = targetTime;
  video.currentTime = currentTime;
  animate();
});

function updateTarget() {
  if (!ready || !video.duration) return;

  const maxScroll =
    document.documentElement.scrollHeight -
    window.innerHeight;

  const progress = maxScroll > 0
    ? window.scrollY / maxScroll
    : 0;

  // 5 loops through the video
  targetTime =
    ((progress * 5) % 1) * video.duration;
}

function animate() {
  if (!ready) return;

  // Smooth interpolation
  currentTime += (targetTime - currentTime) * 0.12;

  // Keep the time inside the video
  currentTime = Math.max(
    0,
    Math.min(video.duration - 0.001, currentTime)
  );

  if (Math.abs(video.currentTime - currentTime) > 0.04) {
    video.currentTime = currentTime;
  }

  requestAnimationFrame(animate);
}

window.addEventListener("scroll", updateTarget, {
  passive: true
});

window.addEventListener("resize", updateTarget);
</script>


</body>
</html>
