
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Video</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  color: white;
  font-family: Arial, sans-serif;
  background: black;
}

.video-bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}

.content {
  height: 500vh;
  text-align: center;
}

section {
  height: 100vh;
  display: grid;
  place-content: center;
  padding: 20px;
  text-shadow: 0 2px 8px black;
}

h1 {
  font-size: clamp(36px, 7vw, 80px);
}

p {
  font-size: 20px;
  margin-top: 15px;
}
</style>
</head>
<body>

<video class="video-bg" muted playsinline preload="auto">
  <source src="ffc69ce7caa10cc9b451dd7f8f759b73.mp4" type="video/mp4">
</video>

<div class="content">
  <section>
    <div>
      <h1>Explore the World</h1>
      <p>Scroll down to begin</p>
    </div>
  </section>

  <section>
    <div>
      <h1>Discover</h1>
      <p>Every scroll reveals a new frame</p>
    </div>
  </section>

  <section>
    <div>
      <h1>Experience</h1>
      <p>Move forward and backward</p>
    </div>
  </section>

  <section>
    <div>
      <h1>Keep Exploring</h1>
    </div>
  </section>

  <section>
    <div>
      <h1>The End</h1>
    </div>
  </section>
</div>

<script>
const video = document.querySelector(".video-bg");

video.pause();

let ready = false;

video.addEventListener("loadedmetadata", () => {
  ready = true;
  video.pause();
  updateVideo();
});

function updateVideo() {
  if (!ready || !video.duration) return;

  const maxScroll =
    document.documentElement.scrollHeight -
    window.innerHeight;

  const progress = maxScroll > 0
    ? window.scrollY / maxScroll
    : 0;

  const time = Math.max(0, Math.min(1, progress))
    * video.duration;

  if (Math.abs(video.currentTime - time) > 0.03) {
    video.currentTime = time;
  }
}

window.addEventListener("scroll", updateVideo, {
  passive: true
});

window.addEventListener("resize", updateVideo);
</script>

</body>
</html>
