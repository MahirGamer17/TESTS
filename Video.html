
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Video</title>

<style>
  .fx-liquid {
  font: 600 32px "JetBrains Mono", monospace;
  color: transparent;
  /* Define the liquid gradient */
  background: linear-gradient(0deg, 
      #4FF8FF 0 46%, 
      rgba(79, 248, 255, 0.55) 48%, 
      transparent 52% 100%
  ) 0 0 / 100% 220%;
  /* Clip background to text shape */
  -webkit-background-clip: text;
  background-clip: text;
  /* Animate the background position to simulate rising liquid */
  animation: fx-liquid 3.4s ease-in-out infinite;
}

@keyframes fx-liquid {
  0%, 100% { background-position: 0 -110%; }
  50%      { background-position: 0 10%; }
}   
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  color: red;
  font-family: Arial, sans-serif;
  background: black;
}

.video-bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}

.content {
  height: 500vh;
  text-align: center;
}

section {
  height: 100vh;
  display: grid;
  place-content: center;
  padding: 20px;
  text-shadow: 0 2px 8px black;
}

h1 {
  font-size: clamp(36px, 7vw, 80px);
}

p {
  font-size: 20px;
  margin-top: 15px;
}
</style>
</head>
<body>

<video class="video-bg" muted playsinline preload="auto">
  <source src="ffc69ce7caa10cc9b451dd7f8f759b73.mp4" type="video/mp4">
</video>

<div class="content">
  <section>
    <div>
      <h1>IT ALWAY FIND YOU</h1>
    </div>
  </section>

  <section>
    <div>
      <h1>YOU CAN RUN BUT CAN NOT HIDE</h1>
    </div>
  </section>

  <section>
    <div>
      <h1>NEVER TRUST ANYONE</h1>
    </div>
  </section>

  <section>
    <div>
      <h1>KEEP YOUR EYE OPEN AT NIGHT</h1>
    </div>
  </section>

  <section>
    <div>
      <h1 class="fx-liquid">The End is coming</h1>
    </div>
  </section>
</div>

<script>
const video = document.querySelector(".video-bg");

video.pause();

let ready = false;

video.addEventListener("loadedmetadata", () => {
  ready = true;
  video.pause();
  updateVideo();
});

function updateVideo() {
  if (!ready || !video.duration) return;

  const maxScroll =
    document.documentElement.scrollHeight -
    window.innerHeight;

  const progress = maxScroll > 0
    ? window.scrollY / maxScroll
    : 0;

  const time = Math.max(0, Math.min(1, progress))
    * video.duration;

  if (Math.abs(video.currentTime - time) > 0.03) {
    video.currentTime = time;
  }
}

window.addEventListener("scroll", updateVideo, {
  passive: true
});

window.addEventListener("resize", updateVideo);
</script>

</body>
</html>
